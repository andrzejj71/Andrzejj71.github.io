<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel NBA – prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap">
<style>
:root{--bg:#111111;--card:#1c1c1c;--line:#333333;--text:#ffffff;--mute:#a9a9a9;--hit:#3dffa0;--miss:#ff6b6b;--gold:#ffffff;--violet:#e60023;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#ffffff;--card:#f6f6f6;--line:#dcdcdc;--text:#111111;--mute:#767676;--hit:#0f9d5c;--miss:#d63a40;--gold:#111111;--violet:#e60023;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:600 15px/1.4 Barlow,system-ui,sans-serif;display:flex;justify-content:center;padding:20px 12px 40px}
.wrap{width:100%;max-width:560px}
h1,.num,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:20px}
.who{display:flex;gap:20px;align-items:center;margin-bottom:6px}
.avatar{width:140px;height:140px;flex:0 0 auto;border-radius:24px;border:2px solid var(--line);background:var(--line);display:grid;place-items:center;font:800 26px "Barlow Condensed",sans-serif;color:#120c26}
h1{font-size:44px;line-height:1.02}
.mute{color:var(--mute)}
.stat{display:flex;align-items:center;gap:12px;margin:18px 0 12px;flex-wrap:wrap}
.stat .big{font-size:34px;color:var(--gold)}
.pill{border:2px solid var(--hit);color:var(--hit);border-radius:10px;padding:2px 10px;font:800 18px "Barlow Condensed",sans-serif}
.pill.under{border-color:var(--miss);color:var(--miss)}
.ring{margin-left:auto;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;text-align:center;position:relative}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--rb,var(--line));-webkit-mask:radial-gradient(circle,transparent 29px,#000 31px);mask:radial-gradient(circle,transparent 29px,#000 31px)}
.ring span{position:relative;font:800 24px "Barlow Condensed",sans-serif}
.ring small{display:block;font:600 10px Barlow,sans-serif;color:var(--mute)}
.panel{display:grid;grid-template-columns:110px 1fr;gap:10px}
.box{background:#ffffff0d;border:1px solid var(--line);border-radius:14px;padding:12px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .box{background:#ebebeb}}
.avg{display:grid;place-content:center;text-align:center}
.avg .num{font-size:54px;color:var(--hit);line-height:1}
.chart{position:relative;height:190px;padding-top:6px}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;position:relative}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font:800 15px "Barlow Condensed",sans-serif}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--hit);transition:height .25s,background .25s}
.bar.miss i{background:var(--miss)}
.lbl{display:flex;gap:5px;margin-top:4px;font-size:10px;color:var(--mute)}
.lbl span{flex:1;text-align:center}
.thr{position:absolute;left:0;right:0;border-top:2px dotted var(--gold);transition:bottom .25s;pointer-events:none}
.search{position:relative;margin-bottom:14px}
.search input{width:100%;background:#ffffff0d;color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:600 16px Barlow,sans-serif}
.search input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .search input{background:#ebebeb}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#sug{position:absolute;left:0;right:0;top:100%;z-index:5;list-style:none;margin:4px 0 0;padding:4px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;max-height:240px;overflow-y:auto}
#sug button{width:100%;text-align:left;background:transparent;color:var(--text);border:0;border-radius:8px;padding:9px 10px;font:600 15px Barlow,sans-serif;cursor:pointer;display:flex;justify-content:space-between}
#sug button:hover,#sug button:focus-visible{background:var(--line);outline:none}
#sug .none{padding:9px 10px;color:var(--mute)}
.rec{margin-top:10px}
.rec .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rec .num{font-size:30px;color:var(--gold)}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.meter i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.upd{margin:14px 4px 0;font-size:13px;color:var(--mute)}
.upd summary{cursor:pointer;font-weight:700;color:var(--text)}
.upd code{display:block;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);overflow-x:auto;white-space:nowrap}
.load{display:flex;gap:10px;align-items:center;margin:14px 4px 0;flex-wrap:wrap}
.ld{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font:700 15px Barlow,sans-serif;cursor:pointer}
.ld:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:24px 0 0;flex-wrap:wrap}
.tabs button{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;font:700 15px Barlow,sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctrl{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.ctrl button{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font:700 15px Barlow,sans-serif;cursor:pointer}
.ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ctrl button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.line{font:800 22px "Barlow Condensed",sans-serif;min-width:44px;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.tiles .box{text-align:center}
.tiles .num{font-size:30px;display:block;line-height:1}
.tiles small{color:var(--mute);font-size:11px}
.note{margin:14px 4px 0;font-size:12px;color:var(--mute)}

/* NOWA SEKCJA: PORÓWNANIE DWÓCH GWIAZD POD KAFELKAMI */
.stars-duel{margin-top:16px;padding:16px;border:1.5px solid #ffc23366;border-radius:20px;background:linear-gradient(180deg, rgba(255,194,51,0.06) 0%, rgba(255,255,255,0.02) 100%)}
.duel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.duel-hdr span{font:800 17px "Barlow Condensed",sans-serif;letter-spacing:.4px;color:#ffc233;text-transform:uppercase}
.duel-hdr small{font-size:12px;color:var(--mute);background:#ffffff0d;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.duel-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.duel-p{display:flex;flex-direction:column;align-items:center;text-align:center;background:#ffffff08;border:1px solid var(--line);border-radius:16px;padding:12px 8px;position:relative;cursor:pointer;transition:border-color .2s, transform .15s}
.duel-p:hover{border-color:#ffc233;transform:translateY(-2px)}
.duel-av-wrap{position:relative;margin-bottom:8px}
.duel-av{width:88px;height:88px;border-radius:50%;border:2.5px solid #ffc233;background:var(--line);display:grid;place-items:center;font:800 24px "Barlow Condensed",sans-serif;color:var(--text);position:relative;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.4)}
.duel-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 12%}
.duel-stat-badge{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:var(--violet);color:#fff;font:800 16px "Barlow Condensed",sans-serif;padding:2px 10px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.5);border:1.5px solid var(--card)}
.duel-name{font:700 15px Barlow,sans-serif;line-height:1.15;margin-top:4px}
.duel-team{font-size:11px;color:var(--mute);margin-bottom:6px}
.duel-prob{font:800 24px "Barlow Condensed",sans-serif;color:var(--hit);line-height:1}
.duel-sub{font-size:11px;color:var(--mute);margin-top:2px}
.duel-vs{font:800 20px "Barlow Condensed",sans-serif;color:var(--mute);text-align:center}
.duel-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;margin-top:12px}
.duel-bar i{height:100%;transition:width .3s}

#p2 .pl[role="button"]{cursor:pointer;border-radius:10px}
#p2 .pl[role="button"]:hover{background:#ffffff14}
#p2 .pl[role="button"]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.av,.logo,.avatar{position:relative;overflow:hidden}
.av img,.logo img,.avatar img{position:absolute;inset:0;width:100%;height:100%}
.av img,.avatar img{object-fit:cover;object-position:center 12%}
.logo img{object-fit:contain;padding:8px;background:#fff;border-radius:50%}
.starb{border:2px solid #ffc233;border-radius:20px;padding:14px;margin-top:12px;box-shadow:0 0 14px #ffc23340}
.starh{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.starh .av{width:68px;height:68px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:800 20px "Barlow Condensed",sans-serif;color:var(--text);flex:0 0 auto}
.starh b{font-size:20px;display:block}.starh small{color:var(--mute);font-size:12px}
.starb .sugb{margin-top:8px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.cmp th{text-align:left;padding:6px;color:var(--mute);font-size:13px}
.cmp td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top}
.cmp td:first-child{color:var(--mute);width:24%}
.cmp ul{margin:0;padding-left:16px}
.cmp .pro li::marker{color:var(--hit)}.cmp .con li::marker{color:var(--miss)}
.tabbar{display:flex;gap:8px;margin:0 0 16px}
.tabbar button{background:transparent;color:var(--text);border:1.5px solid var(--line);border-radius:999px;padding:10px 22px;font:700 16px Barlow,sans-serif;cursor:pointer}
.tabbar button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.tabbar button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.tabpane[hidden]{display:none!important}
.dash2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:stretch;margin:0 auto}
@media (max-width:1000px){.dash2{grid-template-columns:1fr}}
.sugrow{display:flex;gap:8px;align-items:stretch}
.sugrow .sugb{flex:1}
.addb{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:0 12px;font:700 13px Barlow,sans-serif;cursor:pointer}
.addb:hover{background:var(--violet);border-color:var(--violet);color:#fff}
.slipr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.slipr.win{border-color:var(--hit)}.slipr.lose{border-color:var(--miss)}
.slipr label{display:flex;gap:10px;align-items:center;cursor:pointer}
.slipr b{display:block;font-size:16px}.slipr small{color:var(--mute);font-size:12px}
.slipb{display:flex;gap:6px}
.slipb button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font:700 15px Barlow,sans-serif;cursor:pointer}
.slips{margin:14px 0;display:grid;gap:4px}
.slipt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slipt b{font:800 30px "Barlow Condensed",sans-serif;color:var(--hit)}
.b2b{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:999px;background:var(--miss);color:#111;font:800 12px Barlow,sans-serif}
.restn{display:block;margin-top:8px;font-size:12px;color:var(--mute)}
.app{width:min(97vw,1780px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin:0 0 16px;padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.top .load{margin:0}
.ttl{font-size:30px;line-height:1;letter-spacing:.5px}
.col>.card:last-child{flex:1}
.foot{margin-top:16px;display:grid;gap:4px}
@media (max-width:1000px){.app{width:100%;max-width:620px}.top{padding:10px 12px}}

.col{display:flex;flex-direction:column;gap:16px;min-width:0}
