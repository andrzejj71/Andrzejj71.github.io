name: Aktualizacja danych NBA
on:
  schedule:
    - cron: "30 7 * * *"   # codziennie o 07:30 UTC
  workflow_dispatch:        # ręczne uruchomienie przyciskiem
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api
      - run: python aktualizuj_wszystko.py
      - name: Zapisz nba_data.json w repozytorium
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nba_data.json
          git diff --cached --quiet || (git commit -m "Aktualizacja danych" && git push)
